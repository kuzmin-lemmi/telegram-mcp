[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "telegram-mcp"
dynamic = ["version"]
description = "MCP server that lets AI agents draft, preview and publish posts to a Telegram channel with explicit approval"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "kuzmin-lemmi" }]
keywords = ["telegram", "mcp", "model-context-protocol", "claude", "opencode"]
dependencies = [
    "mcp>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"

[tool.hatch.version]
path = "src/telegram_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E9"]
